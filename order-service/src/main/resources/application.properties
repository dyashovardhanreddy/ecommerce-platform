spring.application.name=order-service

#mysql connection
order.schema=${ORDER_SCHEMA:order_service}

spring.datasource.url=jdbc:mysql://localhost:3306/${order.schema}?createDatabaseIfNotExist=true
spring.datasource.username=dev
spring.datasource.password=Password@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_catalog=${order.schema}
spring.jpa.properties.hibernate.default_schema=${order.schema}
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.schemas=${order.schema}
spring.flyway.default-schema=${order.schema}
spring.flyway.placeholders.order_schema=${order.schema}
spring.flyway.baseline-on-migrate=false

order.kafka.topic=${ORDER_KAFKA_TOPIC:orders}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
