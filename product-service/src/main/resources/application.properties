spring.application.name=product-service
server.port=${SERVER_PORT:8082}

product.schema=${PRODUCT_SCHEMA:product_service}

spring.datasource.url=jdbc:mysql://localhost:3306/${product.schema}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=dev
spring.datasource.password=Password@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_catalog=${product.schema}
spring.jpa.properties.hibernate.default_schema=${product.schema}
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.create-schemas=false
spring.flyway.schemas=${product.schema}
spring.flyway.default-schema=${product.schema}
spring.flyway.table=flyway_product_schema_history
spring.flyway.placeholders.product_schema=${product.schema}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
